<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Przykładowa strona</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container main-content text-center">
    <h1 class="mb-4">Moja strona</h1>

    <button id="myButton" class="btn btn-primary btn-lg">
        Kliknij mnie
    </button>

    <p class="mt-3">
        Najazdy: <span id="hoverCount">0</span><br>
        Kliknięcia: <span id="clickCount">0</span>
    </p>

    <h3 class="mt-5">Canvas</h3>
    <canvas id="myCanvas" width="300" height="200"></canvas>

    <h3 class="mt-5">SVG</h3>
    <svg width="300" height="200">
        <!-- Koło -->
        <circle cx="50" cy="50" r="40" fill="red" />

        <!-- Kwadrat -->
        <rect x="120" y="10" width="80" height="80" fill="blue" />

        <!-- Trójkąt -->
        <polygon points="220,90 260,10 300,90" fill="green" />
    </svg>
</div>

<script src="script.js"></script>
</body>
</html>
